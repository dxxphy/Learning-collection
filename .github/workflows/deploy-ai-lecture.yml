name: Deploy AI lecture

on:
  push:
    branches:
      - main
    paths:
      - 'ai_lecture/**'
      - '.github/workflows/deploy-ai-lecture.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ai-lecture
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai_lecture/pnpm-lock.yaml

      - name: Install
        working-directory: ai_lecture
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ai_lecture
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai_lecture/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
